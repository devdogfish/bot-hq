#cloud-config
hostname: bot-hq
preserve_hostname: false
manage_etc_hosts: true
disable_root: true
ssh_pwauth: false
users:
  - name: devdogfish
    gecos: Owner
    lock_passwd: true
    shell: /bin/bash
bootcmd:
  - [systemctl, mask, --now, ssh.service, ssh.socket]
package_update: true
packages:
  - qemu-guest-agent
runcmd:
  - [systemctl, start, qemu-guest-agent.service]
